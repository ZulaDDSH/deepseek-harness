# The `lean` agent preset: a small coding agent with filesystem and shell tools.
#
# The model sees read, glob, grep, write, and the platform shell tool. The complete persona is the
# system prompt, runtime context is suppressed, and compaction uses a 200k cap.
#
# The persona is `complete`, so workspace instruction baselines cannot reach the
# model through the prompt registry. The end-of-turn response rule is the one
# instruction that still arrives, because it is independent of what else the
# model can see: it constrains how an answer is written, not which work is done.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a focused software engineer assistant.
    complete: true
    includeRuntimeContext: false

# `maxBytes` bounds the complete baseline, and the end-of-turn rule is its
# leading block. The budget is far larger than the rule, so the rule survives
# intact and still leaves room for a workspace instruction chain.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536
    endOfTurnRule: true

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    enabledTools: [read, write]

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    enabledTools: [glob, grep]
    sampleOverCapGlobResults: false

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        maxContextWindow: 200000
        thresholdRatio: 0.8

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
