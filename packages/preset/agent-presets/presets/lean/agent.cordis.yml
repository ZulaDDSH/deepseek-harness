# The `lean` agent preset: a small file-oriented coding agent.
#
# The model sees only read, glob, grep, and write. The complete persona is the
# system prompt, runtime context is suppressed, and compaction uses a 200k cap.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: You are a focused software engineer assistant.
    complete: true
    includeRuntimeContext: false

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
  config:
    enabledTools: [read, write]

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    enabledTools: [glob, grep]
    sampleOverCapGlobResults: false

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
      config:
        maxContextWindow: 200000
        thresholdRatio: 0.8

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
