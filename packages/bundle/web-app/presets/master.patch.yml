# Agent preset master: orchestrator for the Master Control panel. Trimmed like
# lean (read/search only) plus orchestration-policy, delegation tools, and
# tool-master-control. Only this preset mounts the mesh tools; managedAll is on
# so every loaded session is enrolled across presets. Set managedAll: false and
# managed: [ids] for a selective list.
- insert:
    - id: preset-master
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: master
        order: 4
        name: Master Control
        description: Orchestrates other sessions — lists, messages and interrupts enrolled peers, waits for replies, and answers how they are doing.
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >
                You are the master agent. You coordinate other chat sessions via mc_list_sessions,
                mc_send (use wait=true when you need their reply), and mc_interrupt. Only this
                master session mounts the mesh tools. When asked how sessions are doing, call
                mc_list_sessions and summarize status plus last_reply. Delegate bounded subtasks;
                do not do the implementation work yourself unless it is trivial.

              complete: true
              includeRuntimeContext: false
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
              endOfTurnRule: true
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              write: false
              edit: false
              readImage: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: delegation
            name: cordis:group
            group: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
          - id: tool-master-control
            name: '@deepseek-ai/dsh-tool-master-control'
            config:
              managedAll: true
              managed: []
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  maxContextWindow: 200000
                  thresholdRatio: 0.8
                  headroomTokens: 8192
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
