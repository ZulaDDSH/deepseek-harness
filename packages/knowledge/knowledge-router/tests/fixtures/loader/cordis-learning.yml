- id: system-prompt
  name: '@deepseek-ai/dsh-system-prompt'
- id: tools
  name: '@deepseek-ai/dsh-tools'
- id: mcp-gitnexus
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    transport: stdio
    serverName: gitnexus
    command: !!js process.execPath
    args: !!js '[process.env.DSH_KNOWLEDGE_FIXTURE]'
    failOnStartupError: true
    reconnect:
      enabled: false
- id: knowledge
  name: '@deepseek-ai/dsh-knowledge-router'
  config:
    mode: manual
    gitnexus:
      enabled: true
      serverName: gitnexus
    learning:
      enabled: true
      command: dsh-knowledge-router-missing-graphify
