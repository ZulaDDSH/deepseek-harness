# Memorix 1.9.10 from your own install instead of the copy the web composition
# ships. The web composition already mounts a `memory-memorix` row that runs the
# bundled Memorix; this overlay restates it with the same id, so applying it
# replaces that row rather than adding a second server. Use it to run another
# Memorix build, or on a composition that does not ship one. Install first:
# npm install --global memorix@1.9.10
- insert:
    - id: memory-memorix
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: memorix
        transport: stdio
        command: memorix
        args: [serve, --allow-untracked]
        env:
          MEMORIX_SQLITE_DRIVER: node
        cwd: !!js process.cwd()
