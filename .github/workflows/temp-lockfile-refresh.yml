name: Temporary lockfile refresh

on:
  pull_request:
  push:
    branches:
      - chore/consolidate-dependency-updates

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      PRIMARY_NODE_VERSION: 24
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/consolidate-dependency-updates
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Regenerate and verify lockfile
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          pnpm install --frozen-lockfile --lockfile-only
      - name: Remove temporary verification scaffolding
        run: |
          git show 57dc46cfb0d6bd4be6b49a955e9e7b22c992b0e7:.github/workflows/ci.yml > .github/workflows/ci.yml
          git rm .github/workflows/temp-lockfile-refresh.yml
      - name: Commit generated lockfile
        run: |
          git config user.name "NomadsReach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "fix(deps): restore supported Vite and Vitest graph"
          git push origin HEAD:chore/consolidate-dependency-updates
