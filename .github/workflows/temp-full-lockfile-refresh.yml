name: Temporary full lockfile refresh

on:
  push:
    branches:
      - chore/consolidate-dependency-updates

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    env:
      PRIMARY_NODE_VERSION: 24
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/consolidate-dependency-updates
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
      - name: Regenerate full lockfile state
        run: pnpm install --no-frozen-lockfile
      - name: Prove frozen install
        run: pnpm install --frozen-lockfile
      - name: Commit lockfile only
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already clean"
            exit 0
          fi
          git config user.name "NomadsReach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m "fix(deps): regenerate supported dependency lockfile"
          git push origin HEAD:chore/consolidate-dependency-updates
