name: Dependency consolidation verification


on:
  push:
    branches:
      - chore/consolidate-dependency-updates

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.lock.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Resolve canonical lockfile
        id: lock
        shell: bash
        run: |
          pnpm install --no-frozen-lockfile --ignore-scripts
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "Nomads_Reach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add pnpm-lock.yaml
          git diff --cached --check
          git commit -m "chore(deps): regenerate consolidated lockfile"
          git push origin HEAD:chore/consolidate-dependency-updates
          echo "changed=true" >> "$GITHUB_OUTPUT"

  linux:
    needs: resolve
    if: needs.resolve.outputs.changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_BUILD_CLIENT_PROFILE: official
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prepare bubblewrap
        run: bash scripts/prepare-ci-bubblewrap.sh

      - name: Build official artifacts
        run: pnpm run build

      - name: Build documentation
        run: pnpm run docs:build

      - name: Verify packed package metadata
        run: pnpm run publint

      - name: Verify Node compatibility
        run: pnpm run check:node-compat

      - name: Run static gate
        run: pnpm run check:ci:static

      - name: Check diff whitespace
        run: git diff --check

  windows:
    needs: resolve
    if: needs.resolve.outputs.changed == 'false'
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_FAIL_FAST: '1'
    steps:
      - uses: actions/checkout@v7

      - name: Enable Developer Mode
        shell: pwsh
        run: >-
          reg add "HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock"
          /t REG_DWORD /f /v "AllowDevelopmentWithoutDevLicense" /d "1"

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run Windows blocking gates
        run: pnpm run check:ci:windows-blocking

      - name: Check diff whitespace
        run: git diff --check

  finalize:
    needs:
      - resolve
      - linux
      - windows
    if: needs.resolve.outputs.changed == 'false' && needs.linux.result == 'success' && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Remove verification workflow
        shell: bash
        run: |
          git config user.name "Nomads_Reach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git rm .github/workflows/dependency-consolidation-verify.yml
          git diff --cached --check
          git commit -m "chore(ci): remove dependency consolidation verifier"
          git push origin HEAD:chore/consolidate-dependency-updates
