name: Consolidated dependency proof

on:
  push:
    branches:
      - chore/consolidate-dependency-updates

permissions:
  contents: write

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_TELEMETRY_DISABLED: '1'
      DSH_GATE_FAIL_FAST: '1'
      DSH_ARCHIVE_BASE_REF: 4978ac93684fcd7a68e6b878d4b0bdc7d23763e0
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Regenerate dependency state
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Regenerate module graph
        run: pnpm run gen-module-graph

      - name: Verify immutable install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Check diff whitespace
        run: git diff --check

      - name: Run static gate
        run: pnpm run check:ci:static

      - name: Commit generated state and remove proof workflow
        shell: bash
        run: |
          git config user.name "Nomads_Reach"
          git config user.email "144523850+NomadsReach@users.noreply.github.com"
          git add pnpm-lock.yaml docs/module-graph.md docs/module-graph.zh.md docs/module-graph.i18n.yaml
          git rm .github/workflows/consolidate-deps-proof.yml
          git diff --cached --check
          git commit -m "chore(deps): finalize consolidated dependency state"
          git push origin HEAD:chore/consolidate-dependency-updates
