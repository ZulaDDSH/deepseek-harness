name: Issue lifecycle

on:
  issues:
    types:
      - opened
      - edited
      - labeled
      - unlabeled
      - closed
      - reopened
      - typed
      - untyped
      - field_added
      - field_removed
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - review_requested
  pull_request_review:
    types:
      - submitted

permissions:
  contents: read

concurrency:
  group: issue-lifecycle-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  lifecycle:
    name: Issue lifecycle
    if: >-
      github.repository == 'deepseek-harness/deepseek-harness' &&
      (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested') &&
      (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.body != null) &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.type != 'Bot') &&
      (github.event_name != 'pull_request_review' || github.event.pull_request.user.type != 'Bot')
    runs-on: ubuntu-latest
    env:
      DSH_ISSUE_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Check out trusted policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Determine lifecycle eligibility
        id: preflight
        env:
          REPOSITORY_IS_FORK: ${{ github.event.repository.fork }}
        shell: bash
        run: |
          if [ "$REPOSITORY_IS_FORK" = "true" ]; then
            printf 'eligible=false\nexempt=true\n' >> "$GITHUB_OUTPUT"
            echo "Issue lifecycle exempt: fork repositories do not share upstream Project governance."
          else
            printf 'eligible=true\nexempt=false\n' >> "$GITHUB_OUTPUT"
          fi
      - name: Create project token
        id: app-token
        if: ${{ steps.preflight.outputs.eligible == 'true' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.DSH_ISSUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.DSH_ISSUE_APP_PRIVATE_KEY }}
          owner: deepseek-harness
          repositories: deepseek-harness
      - name: Handle repository event
        if: ${{ steps.preflight.outputs.eligible == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: node .github/issue-management/policy.mjs lifecycle
