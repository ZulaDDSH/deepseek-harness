version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    exclude-paths:
      # Vendored Cordis sources follow vendor/README.md instead of registry updates.
      - "vendor/**"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 2
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "uv"
    directory: "/python/sdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 1
    groups:
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
      uv-minor-and-patch:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    open-pull-requests-limit: 1
    groups:
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
      actions-all:
        applies-to: version-updates
        patterns: ["*"]
    cooldown:
      default-days: 30
    labels:
      - "kind/dependency"
      - "area/infra"
